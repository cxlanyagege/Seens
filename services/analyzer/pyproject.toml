[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seens-analyzer"
version = "0.1.0"
description = "Local instrument analysis sidecar for Seens"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "onnxruntime>=1.20,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
seens-analyzer = "seenstruments_analyzer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seenstruments_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
